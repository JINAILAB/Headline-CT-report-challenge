[project]
name = "headline-realign"
version = "1.0.0"
description = "Finding-aware contrastive re-alignment for head CT report generation (MICCAI 2026 HEADLINE)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

# NOTE: this is the *training / evaluation* environment only.
# TotalSegmentator, Viola-Unet and vLLM each need their own isolated environment
# because their pins conflict with these. See env/README.md.
dependencies = [
    "torch>=2.5",
    "transformers>=4.46",
    "peft>=0.13",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "einops>=0.8",
    "numpy>=1.26",
    "scipy>=1.14",
    "nibabel>=5.2",
    "pandas>=2.2",
    # S_Auto metric components
    "bert-score>=0.3.13",
    "rouge-score>=0.1.2",
    "nltk>=3.9",
    # optional logging
    "wandb>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
